<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قارئ الكتب PDF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202328;color:#f5f5f5;font-family:system-ui,'Segoe UI',sans-serif}
#toolbar{position:sticky;top:0;background:#121418;border-bottom:1px solid #393d44;z-index:5;padding:10px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 3px 12px #0004}
button,input{font:inherit;color:inherit;border:1px solid #50545c;border-radius:8px;background:#292d33;padding:8px 12px}button{cursor:pointer}button:hover{background:#3a4048}button:disabled{opacity:.4;cursor:not-allowed}
#pageInput{width:65px;text-align:center;direction:ltr}#status{font-size:12px;color:#c4c8ce;min-width:130px;text-align:center}
#pages{padding:16px 10px 30px;display:flex;flex-direction:column;align-items:center;min-height:70vh;gap:14px}canvas{background:#fff;box-shadow:0 5px 24px #0008;border-radius:2px;max-width:100%}#error{padding:14px;color:#ffbcbc;text-align:center;overflow-wrap:anywhere}
@media(max-width:480px){#toolbar{gap:5px;padding:8px}button{padding:7px 9px;font-size:13px}#status{width:100%;min-width:0;order:10}}
</style></head><body>
<div id="toolbar">
<button id="prev" title="الصفحة السابقة">السابق</button><input id="pageInput" inputmode="numeric" aria-label="رقم الصفحة" value="—"><span id="total">/ —</span><button id="next" title="الصفحة التالية">التالي</button>
<button id="minus" title="تصغير">−</button><span id="zoom">100%</span><button id="plus" title="تكبير">+</button><button id="fitWidth">ملاءمة العرض</button><button id="fitPage">ملاءمة الصفحة</button><button id="rotate">↻ تدوير</button><button id="full">ملء الشاشة</button><span id="status">جارٍ فتح الكتاب…</span></div><div id="error"></div><div id="pages"></div>
<script type="module">
import * as pdfjsLib from './build/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='./build/pdf.worker.mjs';
const file=new URLSearchParams(location.search).get('file');let pdf=null,current=1,scale=1,rotation=0,rendering=false,queued=false;
const pages=document.getElementById('pages'),status=document.getElementById('status'),error=document.getElementById('error'),pageInput=document.getElementById('pageInput');
function updateUI(){pageInput.value=current;document.getElementById('total').textContent='/ '+(pdf?.numPages||'—');document.getElementById('zoom').textContent=Math.round(scale*100)+'%';document.getElementById('prev').disabled=current<=1;document.getElementById('next').disabled=!pdf||current>=pdf.numPages;}
async function draw(){if(!pdf)return;if(rendering){queued=true;return;}rendering=true;pages.innerHTML='';try{const p=await pdf.getPage(current),v=p.getViewport({scale,rotation}),c=document.createElement('canvas'),ctx=c.getContext('2d',{alpha:false});const dpr=Math.min(devicePixelRatio||1,2);c.width=Math.floor(v.width*dpr);c.height=Math.floor(v.height*dpr);c.style.width=Math.min(v.width,innerWidth-24)+'px';c.style.height='auto';pages.append(c);await p.render({canvasContext:ctx,viewport:v,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;status.textContent='تم عرض الصفحة';updateUI();}catch(e){console.error(e);status.textContent='تعذر عرض الصفحة';error.textContent=e?.message||String(e);}finally{rendering=false;if(queued){queued=false;draw();}}}
function go(n){if(!pdf)return;current=Math.max(1,Math.min(pdf.numPages,Math.floor(n)||1));updateUI();draw();}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);
pageInput.addEventListener('change',()=>go(pageInput.value));pageInput.addEventListener('keydown',e=>{if(e.key==='Enter')go(pageInput.value)});
document.getElementById('plus').onclick=()=>{scale=Math.min(3,scale+.15);draw()};document.getElementById('minus').onclick=()=>{scale=Math.max(.35,scale-.15);draw()};
document.getElementById('fitWidth').onclick=async()=>{if(!pdf)return;const p=await pdf.getPage(current);scale=Math.max(.35,Math.min(3,(innerWidth-24)/p.getViewport({scale:1,rotation}).width));draw()};
document.getElementById('fitPage').onclick=async()=>{if(!pdf)return;const p=await pdf.getPage(current);const v=p.getViewport({scale:1,rotation});scale=Math.max(.35,Math.min(3,(innerWidth-24)/v.width,(innerHeight-100)/v.height));draw()};
document.getElementById('rotate').onclick=()=>{rotation=(rotation+90)%360;draw()};
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
window.addEventListener('keydown',e=>{if(e.target===pageInput)return;if(e.key==='ArrowLeft')go(current+1);if(e.key==='ArrowRight')go(current-1);});
window.addEventListener('resize',()=>{if(pdf&&scale>1.5)draw()});
if(!file){status.textContent='لم يتم تحديد ملف الكتاب';}
else try{status.textContent='جارٍ الاتصال بملف الكتاب…';let task=pdfjsLib.getDocument({url:file,disableStream:true,disableAutoFetch:true,disableRange:false,rangeChunkSize:65536});task.onProgress=({loaded,total})=>{if(total)status.textContent='تحميل البيانات '+Math.round(loaded/total*100)+'%'};pdf=await task.promise;status.textContent='تم فتح الكتاب';updateUI();await draw();}
catch(e){console.error('PDF load failure',e);status.textContent='تعذر فتح الكتاب';error.innerHTML='تعذر الوصول إلى ملف PDF. قد يكون الخادم يمنع القراءة داخل الموقع (CORS).';}
</script></body></html>
