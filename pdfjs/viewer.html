<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قارئ PDF</title>
<style>*{box-sizing:border-box}body{margin:0;background:#252525;color:#fff;font-family:system-ui,sans-serif}#toolbar{position:sticky;top:0;background:#171717;z-index:3;padding:10px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}button{font:inherit;padding:7px 10px;border:1px solid #555;border-radius:6px;background:#333;color:#fff;cursor:pointer}#status{font-size:13px}#pages{padding:16px;display:flex;flex-direction:column;align-items:center}canvas{background:white;max-width:100%;box-shadow:0 2px 15px #0008}#error{padding:20px;color:#ffc1c1;text-align:center}</style></head><body>
<div id="toolbar"><button id="prev">السابق</button><span id="page">—</span><button id="next">التالي</button><button id="minus">−</button><span id="zoom">100%</span><button id="plus">+</button><button id="fit">ملاءمة العرض</button><span id="status">جارٍ فتح الكتاب…</span></div><div id="error"></div><div id="pages"></div>
<script type="module">
import * as pdfjsLib from './build/pdf.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='./build/pdf.worker.mjs';
const file=new URLSearchParams(location.search).get('file');let pdf=null,current=1,scale=1.1,busy=false;
const pages=document.getElementById('pages'),status=document.getElementById('status');
function label(){document.getElementById('page').textContent=current+' / '+(pdf?.numPages||'—');}
async function draw(){if(!pdf||busy)return;busy=true;pages.innerHTML='';try{const p=await pdf.getPage(current),v=p.getViewport({scale}),c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=v.width;c.height=v.height;c.style.width=Math.min(v.width,innerWidth-20)+'px';pages.append(c);await p.render({canvasContext:ctx,viewport:v}).promise;label();document.getElementById('zoom').textContent=Math.round(scale*100)+'%';}catch(e){console.error(e);status.textContent='تعذر عرض الصفحة';}finally{busy=false;}}
function goto(n){current=Math.max(1,Math.min(pdf.numPages,n));draw();}
document.getElementById('prev').onclick=()=>goto(current-1);document.getElementById('next').onclick=()=>goto(current+1);document.getElementById('plus').onclick=()=>{scale=Math.min(3,scale+.15);draw();};document.getElementById('minus').onclick=()=>{scale=Math.max(.4,scale-.15);draw();};document.getElementById('fit').onclick=async()=>{const p=await pdf.getPage(current);scale=(innerWidth-20)/p.getViewport({scale:1}).width;draw();};
if(!file)status.textContent='لم يتم تحديد الملف';else try{pdf=await pdfjsLib.getDocument({url:file}).promise;status.textContent='تم فتح الكتاب';label();await draw();}catch(e){status.textContent='';document.getElementById('error').textContent='تعذر فتح PDF. تحقق من رابط الملف أو صلاحية الوصول.';console.error(e);}
</script></body></html>
