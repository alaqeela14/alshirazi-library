<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | مكتبة آل الشيرازي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2eb;--paper:#ffffff;--paper-2:#faf8f3;
  --ink:#2b2520;--ink-2:#4a4034;--muted:#8a7e6f;
  --line:#e5ddd0;--line-2:#f0ebe2;
  --primary:#343a40;--primary-dark:#212529;
  --accent:#d4af37;--accent-light:#f8e7b9;
  --green:#4a6b4a;--blue:#4a5c78;--red:#8b3a3a;--orange:#b8703a;
  --radius:10px;--radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(33,37,41,.06);
  --shadow:0 4px 14px rgba(33,37,41,.08);
  --shadow-lg:0 12px 32px rgba(33,37,41,.15);
  --tr:.18s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px;padding-bottom:100px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
.container{width:min(1100px,96%);margin-inline:auto}
.admin-header{background:var(--primary-dark);color:#fff;padding:16px 0;margin-bottom:16px;box-shadow:var(--shadow)}
.admin-header h1{font-size:19px;margin-bottom:3px}
.admin-header p{font-size:12px;opacity:.85}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;transition:all var(--tr);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--green);color:#fff}
.btn-warning{background:var(--orange);color:#fff}
.btn-outline{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn-outline:hover{background:var(--paper-2);border-color:var(--accent)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%;display:inline-grid;place-items:center;font-size:15px}
.btn-publish{background:linear-gradient(135deg,#4a6b4a,#2e4a2e);color:#fff;padding:10px 18px;font-size:14px;font-weight:800}
.btn-publish:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,107,74,.4)}
.btn-publish:disabled{opacity:.6;cursor:not-allowed;transform:none}
.draft-banner{background:#fff3cd;border:1px solid #ffeaa7;color:#856404;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.publish-banner{background:#d4edda;border:1px solid #c3e6cb;color:#155724;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.publish-banner.error{background:#f8d7da;border-color:#f5c6cb;color:#721c24}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.section-toggle{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all var(--tr)}
.section-toggle:hover{border-color:var(--accent)}
.section-toggle h3{font-size:15px;color:var(--primary-dark)}
.section-toggle .arrow{transition:transform var(--tr);font-size:12px;color:var(--muted)}
.section-toggle.open .arrow{transform:rotate(180deg)}
.section-content{display:none;background:var(--paper);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:14px 16px;margin-top:-14px;margin-bottom:14px}
.section-content.open{display:block}
.add-form{background:var(--paper);border:2px solid var(--accent);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;display:none}
.add-form.open{display:block}
.add-form h3{font-size:16px;color:var(--primary-dark);margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:12px;font-weight:700;color:var(--primary-dark)}
.ff input,.ff select,.ff textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);font-size:13px;outline:none;width:100%}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--primary)}
.ff textarea{resize:vertical;min-height:60px}
.ff.full{grid-column:1/-1}
.ff .hint{font-size:11px;color:var(--muted);margin-top:2px}
.form-actions{margin-top:12px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.book-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.book-item{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;transition:all var(--tr)}
.book-item:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}
.book-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.book-title{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;word-break:break-word;flex:1}
.book-meta{font-size:11px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.book-meta .tag{display:inline-flex;align-items:center;gap:3px;background:var(--paper-2);padding:2px 8px;border-radius:9px;line-height:1.6}
.book-meta .tag.cat{color:var(--primary);font-weight:700;background:#f5ede0}
.book-meta .tag.series{color:var(--blue);font-weight:700;background:#e8f0f8}
.book-controls{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.book-delete{width:34px;height:34px;border-radius:6px;background:#fde8e8;color:var(--red);font-size:14px;display:grid;place-items:center;transition:all var(--tr)}
.book-delete:hover{background:var(--red);color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:var(--paper);border-radius:var(--radius-lg);width:min(700px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
.modal-head{padding:14px 18px;background:var(--primary-dark);color:#fff;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px}
.modal-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px;display:grid;place-items:center}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;background:var(--paper-2);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.floating-actions{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:50;box-shadow:0 -4px 14px rgba(0,0,0,.05);flex-wrap:wrap}
.floating-actions .info{font-size:12px;color:var(--muted);flex:1;min-width:140px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary-dark);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.warn{background:var(--orange)}
.token-status{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:9px;font-weight:700}
.token-status.ok{background:#d4edda;color:#155724}
.token-status.missing{background:#f8d7da;color:#721c24}
.list-edit-box{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.media-item-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;background:var(--paper);border:1px solid var(--line-2);border-radius:6px;margin-bottom:4px;font-size:12px}
.media-item-row .mi-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.media-item-row .mi-speaker{font-size:10px;color:var(--muted);margin-right:4px}
.media-item-actions{display:flex;gap:3px}
.mini-btn{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;font-size:11px;background:var(--paper);border:1px solid var(--line);cursor:pointer}
.mini-btn:hover{background:var(--accent);color:#212529}
</style>
</head>
<body>

<header class="admin-header">
  <div class="container">
    <h1>لوحة التحكم — مكتبة آل الشيرازي</h1>
    <p>عدّل الكتب، الوسائط، والموسوعات ثم انشر مباشرة إلى GitHub.</p>
  </div>
</header>

<main class="container">

  <div id="draftBanner" class="draft-banner" style="display:none">
    <span>أنت تعمل على مسودة محفوظة في المتصفح. (لم تُنشر بعد)</span>
    <button class="btn btn-outline" onclick="resetToServer()">تجاهل المسودة</button>
  </div>

  <div id="publishBanner" class="publish-banner" style="display:none"></div>

  <div class="top-actions">
    <button class="btn btn-publish" id="publishAllBtn" onclick="publishAll()">🚀 نشر الكل إلى GitHub</button>
    <button class="btn btn-success" onclick="exportBooks()">💾 تصدير books.json</button>
    <button class="btn btn-warning" onclick="exportMedia()">📁 تصدير videos + audios + lists</button>
  </div>

  <div class="section-toggle" id="ghToggle" onclick="toggleSection('gh')">
    <h3>🔧 إعدادات النشر التلقائي إلى GitHub <span id="tokenStatusBadge" class="token-status missing">غير مفعّل</span></h3>
    <span class="arrow">▼</span>
  </div>
  <div class="section-content" id="ghContent">
    <div class="form-grid">
      <div class="ff"><label>صاحب المستودع</label><input type="text" id="gh-owner" value="alaqeela14"></div>
      <div class="ff"><label>اسم المستودع</label><input type="text" id="gh-repo" value="alshirazi-library"></div>
      <div class="ff"><label>الفرع</label><input type="text" id="gh-branch" value="main"></div>
      <div class="ff full"><label>رمز GitHub (Token)</label><input type="password" id="gh-token" placeholder="github_pat_..."></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="clearToken()">🗑️ حذف الرمز</button>
      <button class="btn btn-outline" onclick="testGitHub()">🔌 اختبار الاتصال</button>
      <button class="btn btn-primary" onclick="saveGitHubSettings()">💾 حفظ</button>
    </div>
    <div id="ghTestResult" style="margin-top:10px;font-size:13px;"></div>
  </div>

  <div class="section-toggle" id="mediaToggle" onclick="toggleSection('media')">
    <h3>🎬 إدارة المكتبة المرئية والصوتية</h3>
    <span class="arrow">▼</span>
  </div>
  <div class="section-content" id="mediaContent">
    <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
      <button class="btn btn-primary" id="tabVideoBtn" onclick="switchMediaTab('video')">المرئية</button>
      <button class="btn btn-outline" id="tabAudioBtn" onclick="switchMediaTab('audio')">الصوتية</button>
      <button class="btn btn-warning" onclick="openListsManager()">📁 إدارة القوائم والسلاسل</button>
    </div>

    <div class="add-form open" style="border:2px solid var(--green); margin-bottom:15px;">
      <h3 style="color:var(--green)">➕ إضافة عنصر للمكتبة</h3>
      <div class="form-grid">
        <div class="ff full"><label>العنوان *</label><input type="text" id="med-title" placeholder="مثال: 1- أهمية الإصلاح"></div>
        <div class="ff full"><label>الرابط (URL) *</label><input type="url" id="med-url" placeholder="https://youtu.be/..."></div>
        <div class="ff"><label>المتحدث / المؤلف</label><input type="text" id="med-speaker" placeholder="مثال: السيد مهدي الحسيني الشيرازي"></div>
        <div class="ff"><label>القائمة (Topic)</label><select id="med-topic" onchange="updateSubtopicDropdown()"></select></div>
        <div class="ff"><label>القائمة الفرعية (Subtopic)</label><select id="med-subtopic"></select></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="clearMediaForm()">مسح</button>
        <button class="btn btn-primary" onclick="addMediaItem()">➕ إضافة العنصر</button>
      </div>
    </div>

    <div class="book-list" id="mediaListBox"></div>
  </div>

  <div class="filters" style="margin-top:20px;">
    <input type="search" id="searchInput" placeholder="🔍 ابحث في الكتب..." oninput="renderBookList()">
  </div>
  <div class="book-list" id="bookList"></div>

</main>

<footer class="floating-actions">
  <span class="info" id="footerInfo">—</span>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-outline" onclick="resetToServer()">🔄 إعادة تحميل</button>
    <button class="btn btn-publish" onclick="publishAll()">🚀 نشر إلى GitHub</button>
  </div>
</footer>

<div class="modal-overlay" id="listsModal">
  <div class="modal">
    <div class="modal-head"><h3>📁 إدارة القوائم والسلاسل</h3><button class="modal-close" onclick="closeListsManager()">✕</button></div>
    <div class="modal-body">
      <div style="display:flex; gap:8px; margin-bottom:15px;">
        <input type="text" id="newTopicName" placeholder="اسم القائمة الرئيسية الجديدة (مثال: الإصلاح الاجتماعي)" style="flex:1; padding:8px; border:1px solid var(--line); border-radius:6px;">
        <button class="btn btn-primary" onclick="addMediaTopic()">إضافة قائمة</button>
      </div>
      <div id="listsManagerBody"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeListsManager()">إغلاق</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const AUTHORS = [
  {id:"shirazi-m", name:"السيد محمد الحسيني الشيرازي"},
  {id:"shirazi-h", name:"السيد حسن الحسيني الشيرازي"},
  {id:"shirazi-s", name:"السيد صادق الحسيني الشيرازي"},
  {id:"shirazi-mr", name:"السيد محمد رضا الشيرازي"},
  {id:"shirazi-mo", name:"السيد مرتضى الحسيني الشيرازي"},
  {id:"shirazi-j", name:"السيد جعفر الحسيني الشيرازي"},
  {id:"shirazi-me", name:"السيد مهدي الحسيني الشيرازي"}
];

let CATS = [], SERIES = [], BOOKS = [], VIDEOS = [], AUDIOS = [];
let MEDIA_LISTS = { video: [], audio: [] };
let currentMediaTab = 'video', editingMediaIndex = -1;
const GH_KEY = 'admin_github_settings_v1';

const esc = s => String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, type='info'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warn' ? 'warn' : '') + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

function getGitHubSettings(){ try { return JSON.parse(localStorage.getItem(GH_KEY) || '{}'); } catch(e) { return {}; } }
function saveGitHubSettings(){
  const owner = document.getElementById('gh-owner').value.trim();
  const repo = document.getElementById('gh-repo').value.trim();
  const branch = document.getElementById('gh-branch').value.trim() || 'main';
  const token = document.getElementById('gh-token').value.trim();
  if (!owner || !repo) { toast('املأ صاحب المستودع واسمه', 'error'); return; }
  if (!token && !getGitHubSettings().token) { toast('أدخل رمز GitHub', 'error'); return; }
  localStorage.setItem(GH_KEY, JSON.stringify({ owner, repo, branch, token: token || getGitHubSettings().token }));
  updateTokenBadge(); toast('تم حفظ إعدادات GitHub', 'success');
}
function clearToken(){ localStorage.removeItem(GH_KEY); document.getElementById('gh-token').value = ''; updateTokenBadge(); }
function updateTokenBadge(){
  const s = getGitHubSettings();
  const badge = document.getElementById('tokenStatusBadge');
  if (s.token && s.owner && s.repo) { badge.textContent = 'مفعّل'; badge.className = 'token-status ok'; }
  else { badge.textContent = 'غير مفعّل'; badge.className = 'token-status missing'; }
}
async function testGitHub(){
  const s = getGitHubSettings();
  if (!s.token) return alert('احفظ الإعدادات أولاً');
  const result = document.getElementById('ghTestResult');
  result.innerHTML = 'جارٍ الاختبار...';
  try {
    const res = await fetch(`https://api.github.com/repos/${s.owner}/${s.repo}`, { headers: { 'Authorization': `token ${s.token}` } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    result.innerHTML = 'الاتصال ناجح'; result.style.color = 'var(--green)';
  } catch(e) { result.innerHTML = 'فشل: ' + e.message; result.style.color = 'var(--red)'; }
}

function toBase64UTF8(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
async function publishFileToGitHub(fileName, data){
  const s = getGitHubSettings();
  if (!s.token) throw new Error('إعدادات GitHub غير مكتملة');
  const apiUrl = `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${fileName}`;
  const headers = { 'Authorization': `token ${s.token}`, 'Accept': 'application/vnd.github.v3+json' };
  let sha = null;
  try {
    const getRes = await fetch(`${apiUrl}?ref=${s.branch}`, { headers });
    if (getRes.ok) sha = (await getRes.json()).sha;
  } catch(e) {}
  const body = { message: `تحديث ${fileName}`, content: toBase64UTF8(JSON.stringify(data, null, 2)), branch: s.branch };
  if (sha) body.sha = sha;
  const putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
  if (!putRes.ok) throw new Error('فشل النشر: ' + (await putRes.json()).message);
  return await putRes.json();
}
async function publishAll(){
  const s = getGitHubSettings();
  if (!s.token) { alert('يجب إعداد رمز GitHub أولاً.'); return; }
  const btn = document.getElementById('publishAllBtn');
  btn.disabled = true; btn.textContent = 'جارٍ النشر...';
  try {
    await publishFileToGitHub('videos.json', { items: VIDEOS.map(cleanObj) });
    await publishFileToGitHub('audios.json', { items: AUDIOS.map(cleanObj) });
    await publishFileToGitHub('media_lists.json', MEDIA_LISTS);
    alert('تم النشر بنجاح!');
    toast('تم النشر', 'success');
  } catch(e) {
    alert('فشل النشر: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '🚀 نشر الكل إلى GitHub';
  }
}

async function loadData(){
  try {
    const resB = await fetch('books.json?t=' + Date.now()); if(resB.ok) BOOKS = (await resB.json()).items || [];
    const resV = await fetch('videos.json?t=' + Date.now()); if(resV.ok) VIDEOS = (await resV.json()).items || [];
    const resA = await fetch('audios.json?t=' + Date.now()); if(resA.ok) AUDIOS = (await resA.json()).items || [];
    const resL = await fetch('media_lists.json?t=' + Date.now()); if(resL.ok) MEDIA_LISTS = await resL.json();
    // ملء القوائم تلقائياً من العناصر الموجودة
    autoPopulateListsFromItems();
  } catch(e) { console.error(e); }
}

function autoPopulateListsFromItems(){
  ['video', 'audio'].forEach(type => {
    if (!MEDIA_LISTS[type]) MEDIA_LISTS[type] = [];
    const items = type === 'video' ? VIDEOS : AUDIOS;
    const topics = new Set(items.map(i => i.topic).filter(Boolean));
    topics.forEach(topicName => {
      if (!MEDIA_LISTS[type].find(l => l.name === topicName)) {
        MEDIA_LISTS[type].push({ name: topicName, subs: [] });
      }
    });
    // إضافة القوائم الفرعية
    items.forEach(item => {
      if (!item.topic || !item.subtopic) return;
      const list = MEDIA_LISTS[type].find(l => l.name === item.topic);
      if (list && !list.subs.find(s => s.name === item.subtopic)) {
        list.subs.push({ name: item.subtopic });
      }
    });
  });
}

async function init(){
  await loadData();
  updateTokenBadge();
  switchMediaTab('video');
  renderBookList();
  document.getElementById('footerInfo').textContent = `${VIDEOS.length} فيديو | ${AUDIOS.length} صوتية | ${BOOKS.length} كتاب`;
}

function renderBookList(){
  const box = document.getElementById('bookList');
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  const list = BOOKS.filter(b => !q || (b.title||'').toLowerCase().includes(q)).slice(0, 50);
  if (list.length === 0) { box.innerHTML = '<div class="empty">لا توجد كتب.</div>'; return; }
  box.innerHTML = list.map(b => `
    <div class="book-item">
      <div class="book-title-row"><div class="book-title">${esc(b.title)}</div></div>
    </div>
  `).join('');
}

function toggleSection(id){
  document.getElementById(id+'Toggle').classList.toggle('open');
  document.getElementById(id+'Content').classList.toggle('open');
}

function switchMediaTab(tab){
  currentMediaTab = tab;
  document.getElementById('tabVideoBtn').className = tab === 'video' ? 'btn btn-primary' : 'btn btn-outline';
  document.getElementById('tabAudioBtn').className = tab === 'audio' ? 'btn btn-primary' : 'btn btn-outline';
  renderMediaList();
  populateMediaDropdowns();
}

function populateMediaDropdowns(){
  const lists = MEDIA_LISTS[currentMediaTab] || [];
  document.getElementById('med-topic').innerHTML = `<option value="">— بدون —</option>` + lists.map(l => `<option value="${esc(l.name)}">${esc(l.name)}</option>`).join('');
  updateSubtopicDropdown();
}

function updateSubtopicDropdown(){
  const topicName = document.getElementById('med-topic').value;
  const lists = MEDIA_LISTS[currentMediaTab] || [];
  const topic = lists.find(l => l.name === topicName);
  const subSelect = document.getElementById('med-subtopic');
  if (topic && topic.subs) {
    subSelect.innerHTML = `<option value="">— بدون —</option>` + topic.subs.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
  } else {
    subSelect.innerHTML = `<option value="">— بدون —</option>`;
  }
}

function renderMediaList(){
  const box = document.getElementById('mediaListBox');
  const items = currentMediaTab === 'video' ? VIDEOS : AUDIOS;
  if (items.length === 0) { box.innerHTML = '<div class="empty">لا توجد عناصر.</div>'; return; }
  box.innerHTML = items.map((item, idx) => `
    <div class="book-item">
      <div class="book-title-row"><div class="book-title">${esc(item.title)}</div></div>
      <div class="book-meta">
        <span class="tag">${esc(item.speaker)}</span>
        ${item.topic ? `<span class="tag cat">${esc(item.topic)}</span>` : ''}
        ${item.subtopic ? `<span class="tag series">↳ ${esc(item.subtopic)}</span>` : ''}
      </div>
      <div class="book-controls" style="grid-template-columns:1fr auto;">
        <div></div>
        <div style="display:flex;gap:4px;">
          <button class="btn btn-outline btn-icon" onclick="editMediaItem(${idx})">✏️</button>
          <button class="book-delete" onclick="deleteMediaItem(${idx})">🗑️</button>
        </div>
      </div>
    </div>
  `).join('');
}

function clearMediaForm(){
  document.getElementById('med-title').value = '';
  document.getElementById('med-url').value = '';
  document.getElementById('med-speaker').value = '';
  editingMediaIndex = -1;
}

function addMediaItem(){
  const title = document.getElementById('med-title').value.trim();
  const url = document.getElementById('med-url').value.trim();
  if (!title || !url) return alert('العنوان والرابط مطلوبان');
  const item = {
    title, url,
    speaker: document.getElementById('med-speaker').value.trim(),
    topic: document.getElementById('med-topic').value,
    subtopic: document.getElementById('med-subtopic').value
  };
  if (editingMediaIndex > -1) {
    if (currentMediaTab === 'video') VIDEOS[editingMediaIndex] = item;
    else AUDIOS[editingMediaIndex] = item;
    toast('تم التعديل', 'success');
  } else {
    if (currentMediaTab === 'video') VIDEOS.unshift(item);
    else AUDIOS.unshift(item);
    toast('تمت الإضافة', 'success');
  }
  autoPopulateListsFromItems();
  renderMediaList();
  clearMediaForm();
}

function editMediaItem(idx){
  const item = currentMediaTab === 'video' ? VIDEOS[idx] : AUDIOS[idx];
  document.getElementById('med-title').value = item.title || '';
  document.getElementById('med-url').value = item.url || '';
  document.getElementById('med-speaker').value = item.speaker || '';
  document.getElementById('med-topic').value = item.topic || '';
  updateSubtopicDropdown();
  document.getElementById('med-subtopic').value = item.subtopic || '';
  editingMediaIndex = idx;
  document.getElementById('med-title').scrollIntoView({behavior:'smooth'});
}

function deleteMediaItem(idx){
  if (!confirm('حذف العنصر؟')) return;
  if (currentMediaTab === 'video') VIDEOS.splice(idx, 1);
  else AUDIOS.splice(idx, 1);
  renderMediaList();
}

function openListsManager(){
  document.getElementById('listsModal').classList.add('open');
  renderListsManager();
}
function closeListsManager(){
  document.getElementById('listsModal').classList.remove('open');
}
function renderListsManager(){
  const lists = MEDIA_LISTS[currentMediaTab] || [];
  const items = currentMediaTab === 'video' ? VIDEOS : AUDIOS;
  const box = document.getElementById('listsManagerBody');
  if (lists.length === 0) {
    box.innerHTML = '<div class="empty">لا توجد قوائم. أضف قائمة جديدة من الأعلى.</div>';
    return;
  }
  box.innerHTML = lists.map((l, i) => {
    const listItems = items.filter(it => it.topic === l.name);
    return `
    <div class="list-edit-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong>${esc(l.name)} (${listItems.length} عنصر)</strong>
        <button class="book-delete" style="width:28px;height:28px;" onclick="deleteMediaTopic(${i})">🗑️</button>
      </div>
      ${(l.subs && l.subs.length > 0) ? `
      <div style="margin-bottom:8px;">
        ${l.subs.map((s, j) => `
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:4px 8px; background:var(--paper); border-radius:4px; margin-bottom:4px;">
            <span>↳ ${esc(s.name)}</span>
            <button class="mini-btn" onclick="deleteMediaSubtopic(${i}, ${j})">✕</button>
          </div>
        `).join('')}
      </div>
      ` : ''}
      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <input type="text" id="new-sub-${i}" placeholder="اسم قائمة فرعية" style="flex:1; padding:4px 8px; font-size:12px; border:1px solid var(--line); border-radius:4px;">
        <button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="addMediaSubtopic(${i})">➕ إضافة فرعية</button>
      </div>
      ${listItems.length > 0 ? `
      <div style="border-top:1px dashed var(--line); padding-top:8px;">
        <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">العناصر داخل هذه القائمة:</div>
        ${listItems.map((item, k) => {
          const realIdx = items.indexOf(item);
          return `<div class="media-item-row">
            <div class="mi-title">${esc(item.title)}</div>
            <span class="mi-speaker">${esc(item.speaker||'')}</span>
            <div class="media-item-actions">
              <button class="mini-btn" onclick="editMediaItem(${realIdx}); closeListsManager();">✏️</button>
            </div>
          </div>`;
        }).join('')}
      </div>
      ` : '<div style="font-size:11px; color:var(--muted);">لا توجد عناصر بعد.</div>'}
    </div>
    `;
  }).join('');
}
function addMediaTopic(){
  const name = document.getElementById('newTopicName').value.trim();
  if (!name) return;
  if (!MEDIA_LISTS[currentMediaTab]) MEDIA_LISTS[currentMediaTab] = [];
  if (MEDIA_LISTS[currentMediaTab].find(l => l.name === name)) return alert('القائمة موجودة مسبقاً');
  MEDIA_LISTS[currentMediaTab].push({ name, subs: [] });
  renderListsManager(); populateMediaDropdowns();
  document.getElementById('newTopicName').value = '';
}
function deleteMediaTopic(i){
  if (!confirm('حذف القائمة الرئيسية وكل ما تحتها؟ (لن تُحذف العناصر من المكتبة)')) return;
  MEDIA_LISTS[currentMediaTab].splice(i, 1);
  renderListsManager(); populateMediaDropdowns();
}
function addMediaSubtopic(i){
  const name = document.getElementById(`new-sub-${i}`).value.trim();
  if (!name) return;
  MEDIA_LISTS[currentMediaTab][i].subs.push({ name });
  renderListsManager(); populateMediaDropdowns();
}
function deleteMediaSubtopic(i, j){
  MEDIA_LISTS[currentMediaTab][i].subs.splice(j, 1);
  renderListsManager(); populateMediaDropdowns();
}

function cleanObj(obj){
  const copy = { ...obj };
  Object.keys(copy).forEach(k => { if (copy[k] === undefined || copy[k] === null || copy[k] === '') delete copy[k]; });
  return copy;
}
function exportBooks(){
  const blob = new Blob([JSON.stringify({items: BOOKS}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'books.json'; a.click();
}
function exportMedia(){
  const files = [
    { name: 'videos.json', data: { items: VIDEOS } },
    { name: 'audios.json', data: { items: AUDIOS } },
    { name: 'media_lists.json', data: MEDIA_LISTS }
  ];
  files.forEach((f, i) => {
    setTimeout(() => {
      const blob = new Blob([JSON.stringify(f.data, null, 2)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click();
    }, i * 300);
  });
}
function resetToServer(){ if(confirm('إعادة تحميل؟ ستفقد التعديلات غير المحفوظة')) location.reload(); }

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
