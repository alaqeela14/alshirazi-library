backend:
  name: github
  repo: alaqeela14/alshirazi-library
  branch: main
  base_url: https://sveltia-cms-auth.alaqeelafoundation.workers.dev
  auth_endpoint: auth

media_folder: "books"
public_folder: "/books"

collections:
  - name: "books"
    label: "الكتب"
    label_singular: "كتاب"
    files:
      - name: "books-list"
        label: "قائمة الكتب"
        file: "books.json"
        fields:
          - label: "الكتب"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} [{{fields.source_type}}]"
            fields:
              - { label: "اسم الكتاب", name: "title", widget: "string" }
              - label: "التصنيف"
                name: "category"
                widget: "select"
                options:
                  - { label: "القرآن والتفسير", value: "quran" }
                  - { label: "العقائد والكلام", value: "aqaid" }
                  - { label: "الفقه والأصول", value: "fiqh" }
                  - { label: "الحديث والأخلاق", value: "akhlaq" }
                  - { label: "السيرة والتاريخ", value: "seerah" }
                  - { label: "أهل البيت (عليهم السلام)", value: "ahlulbayt" }
                  - { label: "الإمام الحسين وعاشوراء", value: "hussein" }
                  - { label: "الإمام المهدي (عجل الله فرجه)", value: "mahdi" }
                  - { label: "السياسة والاقتصاد", value: "siyasah" }
                  - { label: "المجتمع والأسرة والشباب", value: "mujtama" }
                  - { label: "كتب بلغات أخرى", value: "languages" }
              - label: "المؤلف"
                name: "author"
                widget: "select"
                default: "shirazi-m"
                options:
                  - { label: "السيد محمد الحسيني الشيرازي", value: "shirazi-m" }
                  - { label: "السيد صادق الحسيني الشيرازي", value: "shirazi-s" }
                  - { label: "السيد محمد رضا الشيرازي", value: "shirazi-mr" }
                  - { label: "السيد مرتضى الحسيني الشيرازي", value: "shirazi-mo" }
                  - { label: "السيد جعفر الحسيني الشيرازي", value: "shirazi-j" }
                  - { label: "السيد مهدي الحسيني الشيرازي", value: "shirazi-me" }
              - { label: "السنة الهجرية", name: "year", widget: "number", default: 1420 }
              - label: "الموسوعة"
                name: "series"
                widget: "select"
                required: false
                options:
                  - { label: "بدون موسوعة", value: "" }
                  - { label: "موسوعة الفقه", value: "fiqh-encyclopedia" }
              - label: "📦 مصدر الملف"
                name: "source_type"
                widget: "select"
                default: "upload"
                options:
                  - { label: "⬆️ رفع مباشر (من الجهاز)", value: "upload" }
                  - { label: "📁 Google Drive (رابط)", value: "drive" }
                  - { label: "🌐 Archive.org", value: "archive" }
              - { label: "📄 ملف PDF (رفع مباشر)", name: "pdf_file", widget: "file", required: false, media_folder: "books", public_folder: "/books", accept: ".pdf", hint: "الأحجام الصغيرة فقط < 25MB" }
              - { label: "📝 ملف Word (رفع مباشر)", name: "word_file", widget: "file", required: false, media_folder: "books", public_folder: "/books", accept: ".doc,.docx", hint: "الأحجام الصغيرة فقط < 25MB" }
              - { label: "📁 رابط Google Drive (PDF)", name: "drive_pdf", widget: "string", required: false, hint: "الصق رابط المشاركة من Drive" }
              - { label: "📁 رابط Google Drive (Word)", name: "drive_word", widget: "string", required: false, hint: "الصق رابط المشاركة من Drive" }
              - { label: "🌐 معرّف Archive.org", name: "archive_id", widget: "string", required: false, hint: "مثال: taqrib-quran-1" }
              - label: "📋 الصيغ المتوفرة"
                name: "formats"
                widget: "select"
                multiple: true
                default: ["pdf"]
                options:
                  - { label: "PDF", value: "pdf" }
                  - { label: "Word", value: "word" }
