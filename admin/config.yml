backend:
  name: github
  repo: alaqeela14/alshirazi-library
  branch: main
  base_url: https://sveltia-cms-auth.alaqeelafoundation.workers.dev
  auth_endpoint: auth

media_folder: "books"
public_folder: "/books"

collections:
  # ========== 1. الموسوعات ==========
  - name: "series"
    label: "📚 الموسوعات"
    files:
      - name: "series-list"
        label: "إدارة الموسوعات"
        file: "series.json"
        fields:
          - label: "الموسوعات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.name}}"
            fields:
              - { label: "اسم الموسوعة", name: "name", widget: "string" }
              - { label: "المعرّف الإنجليزي", name: "id", widget: "string", hint: "مثال: fiqh-encyclopedia (بدون مسافات)" }
              - { label: "الوصف", name: "desc", widget: "text" }
              - { label: "المؤلف", name: "author", widget: "string", default: "shirazi-m" }

  # ========== 2. المؤلفون ==========
  - name: "authors"
    label: "✍️ المؤلفون"
    files:
      - name: "authors-list"
        label: "إدارة المؤلفين"
        file: "authors.json"
        fields:
          - label: "المؤلفون"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.short}}"
            fields:
              - { label: "المعرّف الإنجليزي", name: "id", widget: "string", hint: "مثال: shirazi-s" }
              - { label: "الاسم الكامل", name: "name", widget: "string" }
              - { label: "الاسم المختصر", name: "short", widget: "string" }
              - { label: "نبذة", name: "bio", widget: "text", required: false }

  # ========== 3. الكتب (مقسّمة) ==========
  - name: "books"
    label: "📖 الكتب"
    files:
      - name: "books-quran"
        label: "📖 القرآن والتفسير"
        file: "books-quran.json"
        fields:
          - label: "الكتب"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}}"
            fields: &book_fields
              - { label: "اسم الكتاب", name: "title", widget: "string" }
              - { label: "المؤلف", name: "author", widget: "string", default: "shirazi-m", hint: "أضف مؤلفاً جديداً من قسم «✍️ المؤلفون»" }
              - { label: "السنة الهجرية", name: "year", widget: "number", default: 1420 }
              - { label: "الموسوعة", name: "series", widget: "string", required: false, hint: "أضف موسوعة جديدة من قسم «📚 الموسوعات»" }
              - { label: "📦 مصدر الملف", name: "source_type", widget: "select", options: [{ label: "⬆️ رفع مباشر", value: "upload" }, { label: "📁 Google Drive", value: "drive" }, { label: "🌐 Archive.org", value: "archive" }], default: "upload" }
              - { label: "📄 ملف PDF", name: "pdf_file", widget: "file", required: false, media_folder: "books", public_folder: "/books", accept: ".pdf" }
              - { label: "📝 ملف Word", name: "word_file", widget: "file", required: false, media_folder: "books", public_folder: "/books", accept: ".doc,.docx" }
              - { label: "📁 رابط Drive (PDF)", name: "drive_pdf", widget: "string", required: false }
              - { label: "📁 رابط Drive (Word)", name: "drive_word", widget: "string", required: false }
              - { label: "🌐 معرّف Archive.org", name: "archive_id", widget: "string", required: false }
              - { label: "الصيغ المتوفرة", name: "formats", widget: "select", multiple: true, default: ["pdf"], options: [{ label: "PDF", value: "pdf" }, { label: "Word", value: "word" }] }

      - name: "books-aqaid"
        label: "🕋 العقائد والكلام"
        file: "books-aqaid.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-fiqh"
        label: "⚖️ الفقه والأصول"
        file: "books-fiqh.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-akhlaq"
        label: "🌸 الحديث والأخلاق"
        file: "books-akhlaq.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-seerah"
        label: "🏛️ السيرة والتاريخ"
        file: "books-seerah.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-ahlulbayt"
        label: "🕌 أهل البيت (عليهم السلام)"
        file: "books-ahlulbayt.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-hussein"
        label: "🌙 الإمام الحسين وعاشوراء"
        file: "books-hussein.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-mahdi"
        label: "✨ الإمام المهدي (عجل الله فرجه)"
        file: "books-mahdi.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-siyasah"
        label: "💰 السياسة والاقتصاد"
        file: "books-siyasah.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-mujtama"
        label: "🤝 المجتمع والأسرة والشباب"
        file: "books-mujtama.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }

      - name: "books-languages"
        label: "🌍 كتب بلغات أخرى"
        file: "books-languages.json"
        fields:
          - { label: "الكتب", name: "items", widget: "list", add_to_top: true, summary: "{{fields.title}}", fields: *book_fields }
