<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة إضافة الأغلفة</title>
<style>
  body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
  textarea { width: 100%; height: 200px; padding: 10px; margin-bottom: 15px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 8px; direction: ltr; font-family: monospace; font-size: 12px; }
  button { background: #4CAF50; color: white; padding: 15px 20px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; }
  button:hover { background: #45a049; }
  h3 { margin-bottom: 10px; font-size: 16px; color: #aaa; }
</style>
</head>
<body>
  <h2>أداة إضافة روابط الأغلفة تلقائياً</h2>
  
  <h3>1. الصق كود ملف الكتب هنا (books-all.json أو غيره):</h3>
  <textarea id="jsonInput" placeholder="الصق الكود هنا..."></textarea>
  
  <button onclick="addCovers()">إضافة الأغلفة تلقائياً</button>

  <h3>2. الكود الجديد (انسخه وضعه في الملف):</h3>
  <textarea id="jsonOutput" readonly></textarea>

  <script>
    function addCovers() {
      const input = document.getElementById('jsonInput').value.trim();
      if(!input) { alert('الرجاء لصق الكود أولاً'); return; }

      try {
        const data = JSON.parse(input);
        if(!data.items) throw new Error("لا يوجد مصفوفة items");

        // الرابط الأساسي الذي رفعت عليه الصور
        const baseUrl = "https://github.com/alaqeela14/alshirazi-library/releases/download/book-covers/";
        let count = 0;

        data.items.forEach(book => {
          let coverName = "";
          
          // استخراج الرقم من المعرف (id)
          if (book.id.startsWith('book-')) {
            // مثلاً book-001 -> 001.jpg
            coverName = book.id.replace('book-', '') + ".jpg";
          } else if (book.id.startsWith('masoomeen-')) {
            // مثلاً masoomeen-01 -> masoomeen-01.jpg
            coverName = book.id + ".jpg";
          } else if (book.id.startsWith('kalima-')) {
            // مثلاً kalima-1 -> kalima-1.jpg
            coverName = book.id + ".jpg";
          } else {
            // كتب أخرى
            coverName = book.id + ".jpg";
          }

          book.cover = baseUrl + coverName;
          count++;
        });

        document.getElementById('jsonOutput').value = JSON.stringify(data, null, 2);
        alert(`تم إضافة الأغلفة لـ ${count} كتاب بنجاح!`);

      } catch(e) {
        alert('خطأ في قراءة الكود: ' + e.message);
      }
    }
  </script>
</body>
</html>
