<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة توليد ملف الكتب</title>
<style>
  body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
  textarea { width: 100%; height: 250px; padding: 10px; margin-bottom: 15px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 8px; direction: rtl; }
  button { background: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 15px; }
  button:hover { background: #45a049; }
  h3 { margin-bottom: 10px; font-size: 16px; color: #aaa; }
</style>
</head>
<body>
  <h2>أداة توليد ملف books-all.json</h2>
  
  <h3>1. الصق قائمة أسماء الكتب هنا (كل اسم في سطر):</h3>
  <textarea id="titlesInput" placeholder="من حياة الرسول الاعظم صلى الله عليه واله&#10;من حياة الإمام أمير المؤمنين (عليه السلام)&#10;..."></textarea>
  
  <button onclick="generateJson()">توليد ملف JSON</button>
  
  <h3>2. الكود الجاهز (انسخه وضعه في ملف books-all.json):</h3>
  <textarea id="jsonOutput" readonly></textarea>

  <script>
    function generateJson() {
      const input = document.getElementById('titlesInput').value;
      const titles = input.split('\n').map(t => t.trim()).filter(t => t !== '');
      
      // الرابط الأساسي الذي رفعت عليه الملفات (تأكد من اسم الوسم)
      const baseUrl = "https://github.com/alaqeela14/alshirazi-library/releases/download/books-files/";
      
      const items = titles.map((title, index) => {
        const num = String(index + 1).padStart(3, '0'); // 001, 002, ...
        return {
          id: `book-${num}`,
          title: title,
          author: "shirazi-m", // السيد محمد الحسيني الشيرازي
          category: "ahlulbayt", 
          formats: ["pdf", "word"],
          pdf_url: `${baseUrl}${num}.pdf`,
          word_url: `${baseUrl}${num}.doc`
        };
      });

      const json = JSON.stringify({ items: items }, null, 2);
      document.getElementById('jsonOutput').value = json;
    }
  </script>
</body>
</html>
